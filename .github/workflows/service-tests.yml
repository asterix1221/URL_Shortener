name: service-tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      # возврат в main файла docs/coverage.json, из которого shields.io рисует бейдж покрытия
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Юнит и интеграционные тесты (Testcontainers)
        working-directory: shortener-service
        run: ./mvnw -B verify
      - name: Сводка прогона и бейдж покрытия
        if: always()
        run: python3 scripts/test-report-summary.py shortener-service/target docs/coverage.json
      - name: Обновить бейдж в main
        if: github.ref == 'refs/heads/main' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/coverage.json
          if ! git diff --cached --quiet; then
            git commit -m "ci: обновить бейдж покрытия JaCoCo"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-coverage
          path: shortener-service/target/site/jacoco
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-test-reports
          path: |
            shortener-service/target/surefire-reports
            shortener-service/target/failsafe-reports
