# Reverse proxy перед shortener-service.
# Единственная точка входа снаружи для HTTP: приложение в compose не публикует порт, до него
# доходят только запросы через этот gateway. Postgres/Redis/Kafka публикуют порты отдельно —
# это нужно для запуска сервиса с хоста (mvnw spring-boot:run) и для Testcontainers-тестов.

upstream shortener_app {
    server app:8080;
    keepalive 32;
}

# Внешний порт виден nginx только из заголовка Host: сам контейнер слушает 80, а наружу
# публикуется на APP_PORT. Без X-Forwarded-Port Tomcat при наличии X-Forwarded-Proto берёт
# порт по умолчанию для схемы, и OpenAPI/Swagger теряют :APP_PORT в адресе «Try it out».
map $http_host $gateway_port {
    ~:(\d+)$ $1;
    default  $server_port;
}

# Формат с временем ответа: без него разбор «тормозит nginx или сервис» невозможен.
# Метка времени добавлена в серии 7.5: разгон — один непрерывный прогон на 600 с, и без времени
# строки нельзя разложить по окнам; пара request_time / upstream_response_time нужна, чтобы
# различить обрыв на шлюзе (10 с) и медленный ответ сервиса.
log_format gateway '$time_iso8601 $remote_addr - $request "$status" $request_time s '
                   'upstream=$upstream_addr upstream_time=$upstream_response_time';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/gateway.log gateway;

    # Максимальный размер тела небольшой: у сервиса единственный POST принимает url/alias,
    # десятки килобайт — уже аномалия, а не полезная нагрузка.
    client_max_body_size 16k;

    # Сам прокси: дёшево отвечает на healthcheck compose и не трогает приложение.
    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Метрики наружу не отдаём: Prometheus скоупит app:8080 напрямую, внутри сети compose.
    # /actuator/health остаётся открытым — им пользуются CI и healthcheck контейнера.
    location = /actuator/prometheus {
        deny all;
    }

    location / {
        proxy_pass http://shortener_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # $http_host, а не $host: $host обрезает порт, и приложение теряет порт публикации.
        proxy_set_header Host $http_host;
        # Сервис берёт IP клиента из request.getRemoteAddr(): без проброса заголовков
        # все клики в статистику попадут с одним внутренним адресом nginx.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $gateway_port;

        # 410 Gone и 3xx редирект должны доходить клиенту как есть, а не превращаться в 200.
        proxy_intercept_errors off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }
}
