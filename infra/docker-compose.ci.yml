# Оверлей CI-стека: infra/docker-compose.yml + infra/docker-compose.ci.yml.
#
# Нужен потому, что job в Jenkins обращается к хостовому демону через сокет
# (Docker-out-of-Docker). Демон резолвит относительные пути bind-монтирований в СВОЕЙ файловой
# системе, а workspace с репозиторием существует только внутри контейнера Jenkins — поэтому
# монтирование ./nginx/nginx.conf в CI-прогоне падает ещё до запуска контейнера. Оверлей
# заменяет его на образ с запечённой конфигурацией (infra/nginx/Dockerfile); разработческий
# файл ниже по-прежнему монтирует конфигурацию, чтобы править nginx.conf без пересборки.
#
# Запуск стека так же, как в Jenkinsfile:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.ci.yml \
#     --env-file infra/.env up -d

services:
  gateway:
    # Тег тот же, что у образа приложения: пайплайн собирает и app, и gateway под
    # APP_IMAGE_TAG=ci-<номер сборки>, чтобы в стеке оказался ровно тот артефакт, который
    # собран в этой сборке, а не образ, оставшийся от прошлой.
    image: shortener-gateway:${APP_IMAGE_TAG:-dev}
    build:
      # Путь относительно этого файла: infra/nginx, где лежат Dockerfile и nginx.conf.
      context: ./nginx
    # !reset затирает volumes из базового файла целиком. Без него compose дописал бы
    # монтирование к списку, и проблема с сокетом осталась бы — список в базовом файле
    # содержит ровно одно значение, ./nginx/nginx.conf.
    volumes: !reset []
