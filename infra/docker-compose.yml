services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"

  kafka:
    image: apache/kafka:3.9.1
    # KAFKA_PORT — хостовый порт EXTERNAL listener'а; он же подставляется в advertised, чтобы
    # клиент с машины (kcat, kafka-consumer-groups.sh, локальный запуск сервиса) получил
    # рабочую метадату. Контейнеры внутри сети compose ходят на kafka:19092 и порт не затрагивают.
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  app:
    build: ../shortener-service
    # Тег задаёт сборка (CI пишет shortener-service:ci-<номер>), поэтому `compose up` берёт
    # готовый образ вместо пересборки: именно тот артефакт, который был собран и назван в
    # пайплайне, и оказывается в стеке. Без тега compose создал бы свой shortener-ci-app.
    image: shortener-service:${APP_IMAGE_TAG:-dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      IP_SALT: ${IP_SALT:-change_me_ip_salt}
      APP_BASE_URL: http://localhost:${APP_PORT}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP: kafka:19092
      APP_CLICKS_CONSUMER_ENABLED: ${APP_CLICKS_CONSUMER_ENABLED:-true}
      RATE_LIMIT_CREATE_PER_MINUTE: ${RATE_LIMIT_CREATE_PER_MINUTE:-10}
      # Переключатели экспериментов этапа 7. Значения из shell перекрывают infra/.env, поэтому
      # вариант прогона задаётся одной командой: `$env:APP_CACHE_ENABLED='false'` перед
      # scripts\reset-state.ps1. Дефолты совпадают с поведением до этапа 7.
      APP_CACHE_ENABLED: ${APP_CACHE_ENABLED:-true}
      APP_CLICKS_MODE: ${APP_CLICKS_MODE:-async}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-10}
      # Пустое значение безопасно и запуск не меняет; через него включают JFR для soak-прогона
      # (`-XX:StartFlightRecording=…`, см. docs/experiments/06-soak.md).
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
    # Лимиты нужны не для экономии, а для воспроизводимости baseline: без них сервис
    # выбирает все ядра VM и цифры двух прогонов сравнивать нельзя.
    cpus: "2"
    mem_limit: 1g
    # Наружу порт приложения не публикуется: единственная точка входа — gateway. Изнутри сети
    # app доступен по app:8080 (Prometheus и healthcheck CI ходят туда же).
    expose:
      - "8080"

  gateway:
    image: nginx:1.30.6
    depends_on:
      app:
        condition: service_started
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/gateway-health"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Профиль monitoring, а не общий стек: и Jenkins-пайплайн, и workflow GitHub поднимают стек
  # без профилей (`up -d`), а конфиги ниже примонтированы из репозитория — хостовый демон из
  # DooD этих путей не видит и упал бы ровно так же, как падал gateway (см. docs/ci-jenkins.md).
  # Плюс Grafana с Prometheus не нужны ни одному тесту, а 2,4 ГБ образов и фоновый scrape
  # только мешают замерам, если их не просили явно:
  #   docker compose -f infra\docker-compose.yml --env-file infra\.env --profile monitoring up -d
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.15.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      # Только на loopback: у Prometheus нет ни аутентификации, ни авторизации.
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - app

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Дашборд отдаётся целиком через provisioning-файлы, встроенный пример не нужен.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/shortener.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  # Поднимается только с профилем ci: `docker compose --profile ci up -d jenkins`.
  # Jenkins крутится здесь, а не в отдельном стеке, чтобы job собирал проект теми же
  # docker-compose-файлами, что и разработка.
  jenkins:
    profiles: ["ci"]
    build: ./jenkins
    image: shortener-jenkins:local
    # Сокет демона смонтирован как root:root 660, а Jenkins внутри работает под uid 1000.
    # group_add даёт этому процессу группу root, и docker CLI получает доступ к сокету —
    # без перевода всего контейнера в root (иначе JENKINS_HOME и артефакты сборок
    # принадлежали бы root, а не пользователю, под которым живут job).
    user: jenkins
    group_add:
      - "root"
    ports:
      # Только на loopback: Jenkins без внешнего доступа, иначе незащищённый UI торчит на всю сеть.
      - "127.0.0.1:${JENKINS_PORT:-18088}:8080"
      - "127.0.0.1:${JENKINS_AGENT_PORT:-50001}:50000"
    environment:
      JENKINS_ADMIN_USER: ${JENKINS_ADMIN_USER:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-}
      JENKINS_URL: http://localhost:${JENKINS_PORT:-18088}/
    volumes:
      - jenkins-data:/var/jenkins_home
      - ./jenkins/init.groovy:/usr/share/jenkins/ref/init.groovy.d/01-security.groovy:ro
      # Job собирает образы и поднимает CI-стек тем же демоном, что и разработка.
      # Монтирование сокета = фактический доступ к хостовому docker; порт из-за этого bound
      # только к 127.0.0.1 (альтернатива — dind-sidecar, дороже по ресурсам).
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      # Без этой записи job не дотянется до опубликованных портов Testcontainers-стека
      # и CI-стека: они живут на «хосте» с точки зрения демона.
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  jenkins-data:
